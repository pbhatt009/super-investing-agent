<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Super Investing</title>
  <style>
    :root { color-scheme: light; --ink: #172033; --muted: #667085; --line: #e7eaf0; --blue: #3559e0; --card: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f6fb; color: var(--ink); font: 15px/1.6 Inter, ui-sans-serif, system-ui, sans-serif; }
    .shell { max-width: 980px; margin: 0 auto; padding: 42px 20px 70px; }
    .hero { margin-bottom: 26px; }
    .eyebrow { color: var(--blue); font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 6px 0 4px; font-size: clamp(30px, 5vw, 48px); letter-spacing: -.04em; }
    .subtitle { color: var(--muted); margin: 0; }
    .panel, .report { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 10px 30px #1720330d; }
    .panel { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; padding: 18px; }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 700; }
    input { border: 1px solid #d7dce7; border-radius: 9px; font: inherit; padding: 10px 12px; }
    #ticker { width: 180px; text-transform: uppercase; }
    button { border: 0; border-radius: 9px; background: var(--blue); color: #fff; cursor: pointer; font: inherit; font-weight: 700; padding: 11px 18px; }
    button:disabled { cursor: wait; opacity: .6; }
    #status { color: var(--muted); min-height: 25px; margin: 12px 2px; }
    .report { display: none; margin-top: 20px; padding: clamp(22px, 5vw, 48px); }
    .report.visible { display: block; }
    .report h1 { font-size: clamp(28px, 4vw, 42px); }
    .report h2 { border-bottom: 1px solid var(--line); margin: 30px 0 12px; padding-bottom: 8px; }
    .report ul { padding-left: 22px; }
    .report li { margin: 8px 0; }
    .report blockquote { border-left: 4px solid #f0ad4e; color: #6b4b16; margin: 16px 0; padding: 8px 16px; background: #fff8e8; }
    .report a { color: var(--blue); }
    .report em { color: var(--muted); }
    .error { color: #b42318 !important; }
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="eyebrow">Evidence-led stock research</div>
      <h1>Super Investing</h1>
      <p class="subtitle">Turn company documents into a clear, source-linked brief for long-term investors.</p>
    </header>

    <form id="research-form" class="panel">
      <label>NSE ticker <input id="ticker" name="ticker" placeholder="SRVCABLE" required></label>
      <label>Research ZIP <input id="file" name="file" type="file" accept=".zip" required></label>
      <button id="submit" type="submit">Generate brief</button>
    </form>
    <div id="status" role="status"></div>
    <article id="report" class="report"></article>
  </main>
  <script>
    const form = document.querySelector('#research-form');
    const status = document.querySelector('#status');
    const report = document.querySelector('#report');
    const submit = document.querySelector('#submit');

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[character]));
    }

    function renderMarkdown(markdown) {
      let html = escapeHtml(markdown.trim());
      html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
      html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
      html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
      html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
      html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
      html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
      html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      return html.split(/\n{2,}/).map(block => block.trim()).filter(Boolean)
        .map(block => /^(<h\d|<ul|<blockquote)/.test(block) ? block : `<p>${block.replace(/\n/g, '<br>')}</p>`)
        .join('');
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      submit.disabled = true;
      report.classList.remove('visible');
      status.className = '';
      status.textContent = 'Reading documents and preparing your brief…';
      const data = new FormData(form);
      try {
        const response = await fetch('/research', { method: 'POST', body: data });
        const responseText = await response.text();
        let result;
        try {
          result = responseText ? JSON.parse(responseText) : {};
        } catch {
          throw new Error(
            `Server returned an invalid response (${response.status}). ` +
            'Check the terminal running Uvicorn for the error.'
          );
        }
        if (!response.ok) throw new Error(result.detail || 'Research request failed.');
        if (!result.brief) throw new Error('The server returned no research brief.');
        report.innerHTML = renderMarkdown(result.brief);
        report.classList.add('visible');
        status.textContent = `${result.documents_processed} document(s) processed.`;
      } catch (error) {
        status.className = 'error';
        status.textContent = error instanceof TypeError
          ? 'Could not connect to the research server. Make sure Uvicorn is running.'
          : error.message;
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
